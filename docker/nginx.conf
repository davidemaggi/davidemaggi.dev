server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits fingerprinted bundles in /assets, safe for long-term immutable caching.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate HTML entrypoint and any non-fingerprinted static file.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # The MonkeyProof blog feed has no CORS headers, so the browser reads it through this same-origin proxy.
  # Variables + resolver resolve the host per request, so nginx still starts if DNS is down at boot.
  location = /feeds/monkeyproof.xml {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $blog_upstream https://monkeyproof.dev;
    proxy_pass $blog_upstream/rss.xml;
    proxy_ssl_server_name on;
    proxy_set_header Host monkeyproof.dev;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "public, max-age=900";
  }

  location / {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
